[package]
name = "hestia-media"
description = "Decoder and renderer backends for Hestia RS streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["openh264"]
# Software H.264 decoder (Cisco OpenH264, compiled from source).
openh264 = ["dep:openh264"]
# Opus decode + desktop playback (needs libopus and ALSA headers on Linux).
audio = ["dep:opus", "dep:cpal", "dep:alsa"]
# Hardware H.264/HEVC/AV1 decoding through VA-API (Linux only; builds
# against libva's headers and links libva, libva-drm and libgbm).
vaapi = ["dep:cros-codecs"]

[dependencies]
hestia-stream.workspace = true
log.workspace = true
rayon = "1.10"
openh264 = { workspace = true, optional = true }
opus = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.10", optional = true }
cros-codecs = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# AMediaCodec + AImageReader (hardware video, Opus) and AAudio (playback).
libc = "0.2"
ndk = { version = "0.9", default-features = false, features = ["media", "api-level-26"] }
ndk-sys = { version = "0.6", features = ["audio"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded"] }
libloading = "0.8"
