[package]
name = "hestia-media"
description = "Decoder and renderer backends for Hestia RS streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["openh264"]
# Software H.264 decoder (Cisco OpenH264, compiled from source).
openh264 = ["dep:openh264"]
# Opus decode + playback via cpal (needs libopus and ALSA headers on Linux).
audio = ["dep:opus", "dep:cpal"]

[dependencies]
hestia-stream.workspace = true
log.workspace = true
rayon = "1.10"
openh264 = { workspace = true, optional = true }
opus = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# AMediaCodec + AImageReader (hardware video, Opus) and AAudio (playback).
ndk = { version = "0.9", default-features = false, features = ["media", "audio", "api-level-26"] }
