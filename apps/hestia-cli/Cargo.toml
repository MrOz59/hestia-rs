[package]
name = "hestia-cli"
description = "Command-line front-end for Hestia RS (discovery, pairing, apps, launch, Hermes diagnostics)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "hestia"
path = "src/main.rs"

[features]
default = ["openh264", "audio", "vaapi"]
# Software H.264 decoding for `hestia stream`.
openh264 = ["hestia-media/openh264"]
# Hardware decoding through VA-API for `hestia stream` (Linux).
vaapi = ["hestia-media/vaapi"]
# `hestia stream --audio`: play the stream's audio.
audio = ["hestia-media/audio"]

[dependencies]
hestia-core.workspace = true
hestia-media.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true
serde_json.workspace = true
directories.workspace = true
sha2.workspace = true
