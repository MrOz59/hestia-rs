name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Shown in the app's Settings → About and in `hestia --version` builds.
  HESTIA_BUILD_ID: ${{ github.sha }}

jobs:
  linux:
    name: Linux (fmt, clippy, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: System packages for Slint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libopus-dev libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release -p hestia-app -p hestia-cli

      - name: UI screenshots (headless, software renderer)
        run: cargo run --release -p hestia-app --example screenshots -- screenshots

      # TEMPORARY (UI rework review): screenshots as base64 in the log.
      - name: Screenshots in the log
        run: |
          for f in screenshots/*.png; do
            convert "$f" -resize 60% -quality 88 /tmp/shot.jpg
            echo "BEGIN-SHOT $(basename "$f")"
            base64 -w 120 /tmp/shot.jpg
            echo "END-SHOT"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: hestia-rs-screenshots
          path: screenshots/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: hestia-rs-linux-x86_64
          path: |
            target/release/hestia-app
            target/release/hestia
          if-no-files-found: error

  interop:
    name: Interop (ENet vs cgutman/enet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: ENet client against the C ENet server
        run: tools/enet-interop/run.sh

  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    # Skia has prebuilt binaries for the 64-bit ABIs only; the 32-bit ones
    # (Android TV boxes and many TVs run a 32-bit system) build it from
    # source. Slow, and a failure there must not hold back the 64-bit APKs.
    continue-on-error: ${{ matrix.skia-from-source }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a, target: aarch64-linux-android, sysroot: aarch64-linux-android, skia-from-source: false }
          - { abi: x86_64, target: x86_64-linux-android, sysroot: x86_64-linux-android, skia-from-source: false }
          - { abi: armeabi-v7a, target: armv7-linux-androideabi, sysroot: arm-linux-androideabi, skia-from-source: true }
          - { abi: x86, target: i686-linux-android, sysroot: i686-linux-android, skia-from-source: true }
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Slint's Android backend compiles a small Java helper at build time, so
      # it needs a JDK plus an SDK platform and build-tools.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;30.0.16248370"

      # Slint renders with Skia on Android, and skia-bindings downloads a
      # prebuilt libskia.a built with a recent NDK: its libc++ calls
      # std::__hash_memory, which older NDKs' libc++ (r27, r29) lacks, so the
      # app would fail to load ("cannot locate symbol"). Build with the same
      # NDK, and point every tool (cargo-ndk, cc) at it.
      - name: Android environment
        run: |
          ndk="$ANDROID_HOME/ndk/30.0.16248370"
          for v in ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK ANDROID_NDK_LATEST_HOME ANDROID_NDK_PATH NDK_HOME; do
            echo "$v=$ndk" >> "$GITHUB_ENV"
          done
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar" >> "$GITHUB_ENV"

      - name: Tools to build Skia from source
        if: matrix.skia-from-source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libclang-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-ndk30-${{ matrix.abi }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native library
        run: cargo ndk -t ${{ matrix.abi }} --platform 26 build --release -p hestia-app --lib

      # The .so must not depend on symbols nothing will provide at runtime
      # (dlopen fails with "cannot locate symbol" on the device otherwise).
      - name: Check native library dependencies
        run: |
          tools="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          so=target/${{ matrix.target }}/release/libhestia_app.so
          echo "NEEDED:"; "$tools/llvm-readelf" -d "$so" | grep NEEDED
          if "$tools/llvm-readelf" -d "$so" | grep -q 'libc++_shared'; then
            echo "::error::libhestia_app.so needs libc++_shared.so (expected static libc++)"; exit 1
          fi
          cxx=$("$tools/llvm-nm" -D --undefined-only "$so" | awk '{print $NF}' \
            | grep -E '__ndk1|__gxx_personality|^__cxa_(allocate_exception|throw|begin_catch|end_catch|rethrow|guard_)|^_ZT[ISV]|^_Zn[wa]|^_Zd[la]' || true)
          if [ -n "$cxx" ]; then
            echo "::error::unresolved C++ runtime symbols in libhestia_app.so"; echo "$cxx" | head -40
            libdir="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.sysroot }}"
            for lib in libc++_static.a libc++abi.a libc++_shared.so; do
              echo "$lib: $("$tools/llvm-nm" -A "$libdir/$lib" 2>/dev/null | grep -c hash_memory) hash_memory symbols"
            done
            echo "native/C++ crates for Android:"
            cargo tree -p hestia-app --target ${{ matrix.target }} --prefix none -e normal,build 2>/dev/null \
              | grep -iE 'skia|sys|openh264|^cc |cxx|oboe' | sort -u
            exit 1
          fi
          echo "no unresolved C++ runtime symbols"
          ls -l "$so"

      - uses: actions/upload-artifact@v4
        with:
          name: hestia-rs-android-lib-${{ matrix.abi }}
          path: target/${{ matrix.target }}/release/libhestia_app.so
          if-no-files-found: error

  # One universal APK with every ABI that built, plus one per ABI, all
  # signed with the Hestia RS key from this repository's signing secrets.
  # Test builds can use a throwaway key when signing secrets are absent.
  android-package:
    name: Android APKs
    needs: android
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      apk-artifact-id: ${{ steps.upload-apks.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: actions/download-artifact@v4
        with:
          pattern: hestia-rs-android-lib-*
          path: libs

      - name: Package APKs
        env:
          RS_KEYSTORE_B64: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          RS_STORE_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          RS_KEY_ALIAS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.ANDROID_KEY_ALIAS || '' }}
          RS_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.ANDROID_KEY_PASSWORD || '' }}
          LEGACY_KEYSTORE_B64: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.HESTIA_NIGHTLY_KEYSTORE_BASE64 || '' }}
          LEGACY_STORE_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.HESTIA_NIGHTLY_STORE_PASSWORD || '' }}
          LEGACY_KEY_ALIAS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.HESTIA_NIGHTLY_KEY_ALIAS || '' }}
          LEGACY_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.HESTIA_NIGHTLY_KEY_PASSWORD || '' }}
        run: |
          mkdir -p jni
          for dir in libs/hestia-rs-android-lib-*; do
            abi=${dir#libs/hestia-rs-android-lib-}
            mkdir -p "jni/$abi" && cp "$dir/libhestia_app.so" "jni/$abi/"
          done
          ls -R jni
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if [[ -n "$RS_KEYSTORE_B64" && -n "$RS_STORE_PASSWORD" ]]; then
              printf '%s' "$RS_KEYSTORE_B64" | base64 -d > "$keystore"
              export ANDROID_KEYSTORE_PASSWORD="$RS_STORE_PASSWORD"
              export ANDROID_KEY_ALIAS="$RS_KEY_ALIAS" ANDROID_KEY_PASSWORD="$RS_KEY_PASSWORD"
            elif [[ -n "$LEGACY_KEYSTORE_B64" && -n "$LEGACY_STORE_PASSWORD" ]]; then
              printf '%s' "$LEGACY_KEYSTORE_B64" | base64 -d > "$keystore"
              export ANDROID_KEYSTORE_PASSWORD="$LEGACY_STORE_PASSWORD"
              export ANDROID_KEY_ALIAS="$LEGACY_KEY_ALIAS" ANDROID_KEY_PASSWORD="$LEGACY_KEY_PASSWORD"
            else
              echo "::error::Configure the Hestia RS nightly signing key in this repository"
              exit 1
            fi
            echo "signing with the persistent Hestia RS key"
          else
            keytool -genkeypair -keystore "$keystore" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Hestia RS CI"
            export ANDROID_KEYSTORE_PASSWORD=android
            echo "signing CI artifacts with a temporary key"
          fi
          export ANDROID_KEYSTORE="$keystore"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          # Above what cargo-apk gave earlier nightlies, so they upgrade.
          code=$((1000000 + GITHUB_RUN_NUMBER))
          scripts/android-package.sh jni apks "$code" "$version-nightly.$GITHUB_RUN_NUMBER+${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v4
        id: upload-apks
        with:
          name: hestia-rs-android-apks
          path: apks/*.apk
          if-no-files-found: error
          overwrite: true

  android-install:
    name: Android APK install and update
    needs: android-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0"

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.android-package.outputs.apk-artifact-id }}
          path: apks
          merge-multiple: true

      - name: Verify the downloaded APKs
        run: |
          tools="$ANDROID_HOME/build-tools/34.0.0"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          code=$((1000000 + GITHUB_RUN_NUMBER))
          version_name="$version-nightly.$GITHUB_RUN_NUMBER+${GITHUB_SHA::7}"
          expected_package="package: name='com.mroz59.hestia.rs' versionCode='$code' versionName='$version_name'"
          expected_cert=
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            expected_cert=a76f6edbd5bfffbc6953f90673b8487c6029398db16f67ae9f6b2da84a2f6b0b
          fi

          for variant in universal arm64-v8a x86_64; do
            if [[ ! -f "apks/hestia-rs-android-$variant.apk" ]]; then
              echo "::error::Missing required $variant APK"
              exit 1
            fi
          done
          universal_abis=()
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if [[ -f "apks/hestia-rs-android-$abi.apk" ]]; then
              universal_abis+=("$abi")
            fi
          done

          for apk in apks/*.apk; do
            variant=${apk##*/hestia-rs-android-}
            variant=${variant%.apk}
            expected_abis=("$variant")
            if [[ "$variant" == universal ]]; then
              expected_abis=("${universal_abis[@]}")
            fi
            badging=$("$tools/aapt2" dump badging "$apk")
            package=$(sed -n '/^package: /p' <<< "$badging")
            actual_abis=$(sed -n 's/^native-code: //p' <<< "$badging" | tr -d "'" | tr ' ' '\n' | sed '/^$/d' | LC_ALL=C sort)
            if [[ "$package" != "$expected_package"* || "$actual_abis" != "$(printf '%s\n' "${expected_abis[@]}")" ]]; then
              echo "::error::$apk has unexpected package metadata or native ABIs"
              printf '%s\n' "$package" "$actual_abis"
              exit 1
            fi
            "$tools/zipalign" -c 4 "$apk"
            certificate=$("$tools/apksigner" verify --print-certs "$apk")
            fingerprint=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$certificate")
            expected_cert=${expected_cert:-$fingerprint}
            if [[ ! "$fingerprint" =~ ^[a-f0-9]{64}$ || "$fingerprint" != "$expected_cert" ]]; then
              echo "::error::$apk has an unexpected signing certificate: $fingerprint"
              exit 1
            fi
            echo "$apk: $version_name, certificate $fingerprint"
          done

      - name: Download the previous nightly for the update test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == "nightly" and (.draft | not)) | .id')
          if [[ -z "$release" ]]; then
            echo '::notice::No published nightly exists yet; checking fresh install.'
            exit 0
          fi
          apk=hestia-rs-android-universal.apk
          gh release download nightly --repo "$GITHUB_REPOSITORY" --pattern "$apk" --dir previous
          test -s "previous/$apk"
          echo "PREVIOUS_NIGHTLY_APK=previous/$apk" >> "$GITHUB_ENV"

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: bash scripts/check-android-install.sh apks/hestia-rs-android-universal.apk

  # Every push to main replaces the "nightly" pre-release with fresh builds.
  nightly:
    name: Nightly release
    needs: [linux, android-package, android-install, interop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Linux build and screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: 'hestia-rs-{linux-x86_64,screenshots}'
          path: artifacts

      - name: Download APKs from the packaging job
        if: ${{ needs.android-package.outputs.apk-artifact-id != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.android-package.outputs.apk-artifact-id }}
          path: artifacts/hestia-rs-android-apks
          merge-multiple: true

      - name: Package
        run: |
          mkdir -p dist staging/hestia-rs
          linux=artifacts/hestia-rs-linux-x86_64
          install -m 755 "$linux/hestia-app" "$linux/hestia" staging/hestia-rs/
          cp README.md LICENSE staging/hestia-rs/
          tar -C staging -czf dist/hestia-rs-linux-x86_64.tar.gz hestia-rs
          test -f artifacts/hestia-rs-android-apks/hestia-rs-android-universal.apk
          cp artifacts/hestia-rs-android-apks/*.apk dist/
          if ls artifacts/hestia-rs-screenshots/*.png >/dev/null 2>&1; then
            (cd artifacts/hestia-rs-screenshots && zip -q ../../dist/ui-screenshots.zip *.png)
          fi
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=${GITHUB_SHA::7}
          {
            echo "Automatic build of \`main\` at ${GITHUB_SHA} ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            echo
            echo "- **Android:** \`hestia-rs-android-universal.apk\` (phones, tablets, Android TV, Chromebooks: every ABI built in this run: $(cd dist && ls hestia-rs-android-*.apk 2>/dev/null | grep -v universal | sed 's/hestia-rs-android-//; s/\.apk//' | paste -sd ' ' -)), or the smaller per-ABI \`hestia-rs-android-<abi>.apk\` (most phones: arm64-v8a)"
            echo "- **Linux (x86_64):** \`hestia-rs-linux-x86_64.tar.gz\` (needs libopus, ALSA and a recent glibc)"
            echo "- **Screenshots:** \`ui-screenshots.zip\` (phone and desktop, rendered headless)"
            echo
            if git rev-parse -q --verify refs/tags/nightly >/dev/null; then
              echo "### Changes since the previous nightly"
              git log --no-merges --format='- %s (%h)' nightly..HEAD | head -50
            else
              echo "### Latest changes"
              git log --no-merges --format='- %s (%h)' -15
            fi
          } > notes.md
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/nightly 2>/dev/null || true
          gh release create nightly dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Nightly $(date -u +%Y-%m-%d) ($short)" --notes-file notes.md
