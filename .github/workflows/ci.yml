name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Shown in the app's Settings → About and in `hestia --version` builds.
  HESTIA_BUILD_ID: ${{ github.sha }}

jobs:
  linux:
    name: Linux (fmt, clippy, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: System packages for Slint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libopus-dev libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release -p hestia-app -p hestia-cli

      - name: UI screenshots (headless, software renderer)
        run: cargo run --release -p hestia-app --example screenshots -- screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: hestia-rs-screenshots
          path: screenshots/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: hestia-rs-linux-x86_64
          path: |
            target/release/hestia-app
            target/release/hestia
          if-no-files-found: error

  interop:
    name: Interop (ENet vs cgutman/enet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: ENet client against the C ENet server
        run: tools/enet-interop/run.sh

  android:
    name: Android (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Slint's Android backend compiles a small Java helper at build time, so
      # it needs a JDK plus an SDK platform and build-tools.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;30.0.16248370"

      # Slint renders with Skia on Android, and skia-bindings downloads a
      # prebuilt libskia.a built with a recent NDK: its libc++ calls
      # std::__hash_memory, which older NDKs' libc++ (r27, r29) lacks, so the
      # app would fail to load ("cannot locate symbol"). Build with the same
      # NDK, and point every tool (cargo-ndk, cargo-apk, cc) at it.
      - name: Android environment
        run: |
          ndk="$ANDROID_HOME/ndk/30.0.16248370"
          for v in ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK ANDROID_NDK_LATEST_HOME ANDROID_NDK_PATH NDK_HOME; do
            echo "$v=$ndk" >> "$GITHUB_ENV"
          done
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-ndk30

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native library
        run: cargo ndk -t arm64-v8a --platform 26 build --release -p hestia-app --lib

      # The .so must not depend on symbols nothing will provide at runtime
      # (dlopen fails with "cannot locate symbol" on the device otherwise).
      - name: Check native library dependencies
        run: |
          tools="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          so=target/aarch64-linux-android/release/libhestia_app.so
          echo "NEEDED:"; "$tools/llvm-readelf" -d "$so" | grep NEEDED
          if "$tools/llvm-readelf" -d "$so" | grep -q 'libc++_shared'; then
            echo "::error::libhestia_app.so needs libc++_shared.so (expected static libc++)"; exit 1
          fi
          cxx=$("$tools/llvm-nm" -D --undefined-only "$so" | awk '{print $NF}' \
            | grep -E '__ndk1|__gxx_personality|^__cxa_(allocate_exception|throw|begin_catch|end_catch|rethrow|guard_)|^_ZT[ISV]|^_Zn[wa]|^_Zd[la]' || true)
          if [ -n "$cxx" ]; then
            echo "::error::unresolved C++ runtime symbols in libhestia_app.so"; echo "$cxx" | head -40
            echo "--- diagnostics"
            ls "$ANDROID_HOME/ndk" || true
            "$tools/clang++" --version | head -1
            libdir="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android"
            for lib in libc++_static.a libc++abi.a libc++_shared.so; do
              echo "$lib: $("$tools/llvm-nm" -A "$libdir/$lib" 2>/dev/null | grep -c hash_memory) hash_memory symbols"
            done
            grep -rln "__hash_memory" "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/c++/v1" | head -5 || true
            echo "archives referencing __hash_memory:"
            find target/aarch64-linux-android/release -name '*.rlib' -o -name '*.a' | while read -r f; do
              if "$tools/llvm-nm" -A "$f" 2>/dev/null | grep -q __hash_memory; then
                echo "  $f"; "$tools/llvm-nm" -A "$f" 2>/dev/null | grep __hash_memory | head -3
              fi
            done
            echo "native/C++ crates for Android:"
            cargo tree -p hestia-app --target aarch64-linux-android --prefix none -e normal,build 2>/dev/null \
              | grep -iE 'skia|sys|openh264|^cc |cxx|oboe' | sort -u
            find target -path '*openh264-sys2-*/output' | while read -r out; do
              echo "== $out"; grep -E "^(CXX|CXXFLAGS|CXXSTDLIB|cargo:rustc-link-lib)" "$out" | grep -v "= None" | head -20
            done
            exit 1
          fi
          echo "no unresolved C++ runtime symbols"

      - uses: actions/upload-artifact@v4
        with:
          name: hestia-rs-android-arm64-lib
          path: target/aarch64-linux-android/release/libhestia_app.so
          if-no-files-found: error

      # Packaging is best effort while the Android shell is a prototype.
      - name: Package APK (cargo-apk)
        id: apk
        continue-on-error: true
        # Signed with the key in the ANDROID_KEYSTORE_BASE64 /
        # ANDROID_KEYSTORE_PASSWORD secrets, so nightly APKs install over each
        # other. Without them a throwaway key is generated per run (then each
        # build must be uninstalled before installing the next).
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cargo install cargo-apk --locked
          keystore="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$keystore"
            export CARGO_APK_RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            echo "signing with the repository key"
          else
            keytool -genkeypair -keystore "$keystore" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Hestia RS CI"
            export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
            echo "::warning::ANDROID_KEYSTORE_BASE64/PASSWORD not set: APK signed with a throwaway key"
          fi
          export CARGO_APK_RELEASE_KEYSTORE="$keystore"
          set +e
          cargo apk build --release -p hestia-app --lib
          status=$?
          rm -f "$keystore"
          [ $status -eq 0 ] && "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs target/release/apk/hestia-rs.apk | head -3
          exit $status

      - uses: actions/upload-artifact@v4
        if: steps.apk.outcome == 'success'
        with:
          name: hestia-rs-android-arm64-apk
          path: target/release/apk/hestia-rs.apk

  # Every push to main replaces the "nightly" pre-release with fresh builds.
  nightly:
    name: Nightly release
    needs: [linux, android, interop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          mkdir -p dist staging/hestia-rs
          linux=artifacts/hestia-rs-linux-x86_64
          install -m 755 "$linux/hestia-app" "$linux/hestia" staging/hestia-rs/
          cp README.md LICENSE staging/hestia-rs/
          tar -C staging -czf dist/hestia-rs-linux-x86_64.tar.gz hestia-rs
          if [ -f artifacts/hestia-rs-android-arm64-apk/hestia-rs.apk ]; then
            cp artifacts/hestia-rs-android-arm64-apk/hestia-rs.apk dist/hestia-rs-android-arm64.apk
          else
            echo "::warning::no APK in this run"
          fi
          if ls artifacts/hestia-rs-screenshots/*.png >/dev/null 2>&1; then
            (cd artifacts/hestia-rs-screenshots && zip -q ../../dist/ui-screenshots.zip *.png)
          fi
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=${GITHUB_SHA::7}
          {
            echo "Automatic build of \`main\` at ${GITHUB_SHA} ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            echo
            echo "- **Android (arm64):** \`hestia-rs-android-arm64.apk\`"
            echo "- **Linux (x86_64):** \`hestia-rs-linux-x86_64.tar.gz\` (needs libopus, ALSA and a recent glibc)"
            echo "- **Screenshots:** \`ui-screenshots.zip\` (phone and desktop, rendered headless)"
            echo
            if git rev-parse -q --verify refs/tags/nightly >/dev/null; then
              echo "### Changes since the previous nightly"
              git log --no-merges --format='- %s (%h)' nightly..HEAD | head -50
            else
              echo "### Latest changes"
              git log --no-merges --format='- %s (%h)' -15
            fi
          } > notes.md
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/nightly 2>/dev/null || true
          gh release create nightly dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Nightly $(date -u +%Y-%m-%d) ($short)" --notes-file notes.md
