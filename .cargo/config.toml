# Android: the app's C++ code (Skia, used by Slint's Android renderer, and
# OpenH264) links libc++ statically into libhestia_app.so instead of relying on
# libc++_shared.so being packaged in the APK. With a single native library the
# NDK recommends c++_static. The C++ ABI part (libc++abi) is added by
# apps/hestia-app/build.rs.
#
# Build with the NDK that matches skia-bindings' prebuilt libskia.a (r30 at the
# moment, see .github/workflows/ci.yml); older NDKs' libc++ lacks symbols it
# uses and the app fails to load on the device.
[env]
CXXSTDLIB_aarch64_linux_android = "c++_static"
CXXSTDLIB_armv7_linux_androideabi = "c++_static"
CXXSTDLIB_x86_64_linux_android = "c++_static"
CXXSTDLIB_i686_linux_android = "c++_static"
